[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlantic-policy-rag"
version = "0.1.0"
description = "Atlantic Ventures policy RAG API (hybrid retrieval over corporate policy docs)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "qdrant-client",
    "fastembed",
    "sentence-transformers",
    "google-genai",
    "python-dotenv",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
]
eval = [
    # Pin: ragas 0.4.x breaks on langchain-community sunset (ChatVertexAI removed).
    # 0.2.15 + langchain 0.3 stack works with Gemini via OpenAI-compatible endpoint.
    "ragas==0.2.15",
    "langchain-openai>=0.2,<0.3",
    "langchain-community>=0.3,<0.4",
    "langchain-core>=0.3,<0.4",
    "datasets>=2.0,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs Qdrant (and optionally local embedding model download)",
    "live: live external deps — BGE-M3 when RUN_LIVE_EMBEDDING=1; benchmark when LIVE=1",
]
